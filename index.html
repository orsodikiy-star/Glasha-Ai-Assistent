<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Glasha</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

/* APP */

.app{
    width:100vw;
    height:100vh;
    position:relative;
    background:#000;
}

/* HEADER */

.header{
    position:absolute;
    top:0;
    left:0;

    width:100%;
    height:70px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 20px;

    background:rgba(0,0,0,0.7);

    z-index:100;
}

.logo{
    color:white;
    font-size:28px;
    font-weight:bold;
}

.bell{
    font-size:34px;
    cursor:pointer;
    user-select:none;
}

/* MAIN VIDEO */

.video-container{
    width:100%;
    height:100%;
}

#mainPlayer{
    width:100%;
    height:100%;
    object-fit:cover;
    background:black;
}

/* VIDEO LIST */

.video-grid{
    position:absolute;

    bottom:20px;
    left:50%;

    transform:translateX(-50%);

    width:92%;

    display:grid;
    grid-template-columns:1fr;

    gap:14px;

    z-index:50;

    transition:0.3s;
}

/* HIDE PANEL */

.hide{
    opacity:0;
    pointer-events:none;
    transform:translateX(-50%) translateY(40px);
}

/* CARD */

.video-card{
    position:relative;

    height:120px;

    overflow:hidden;

    border-radius:18px;

    cursor:pointer;

    background:#222;
}

.video-card video{
    width:100%;
    height:100%;
    object-fit:cover;
}

.video-title{
    position:absolute;

    left:0;
    bottom:0;

    width:100%;

    padding:12px;

    color:white;

    font-size:18px;

    background:linear-gradient(
        to top,
        rgba(0,0,0,0.9),
        transparent
    );
}

</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <div class="header">

        <div class="logo">
            Glasha
        </div>

        <div class="bell" onclick="toggleVideos()">
            🔔
        </div>

    </div>

    <!-- MAIN VIDEO -->

    <div class="video-container">

        <video
            id="mainPlayer"
            autoplay
            muted
            loop
            playsinline
        >

            <source
                src="https://www.w3schools.com/html/mov_bbb.mp4"
                type="video/mp4"
            >

        </video>

    </div>

    <!-- VIDEO CARDS -->

    <div class="video-grid" id="videoGrid">

        <!-- 1 -->

        <div
            class="video-card"
            onclick="changeVideo('https://www.w3schools.com/html/mov_bbb.mp4')"
        >

            <video muted autoplay loop playsinline>
                <source
                    src="https://www.w3schools.com/html/mov_bbb.mp4"
                    type="video/mp4"
                >
            </video>

            <div class="video-title">
                Глаша пишет
            </div>

        </div>

        <!-- 2 -->

        <div
            class="video-card"
            onclick="changeVideo('https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4')"
        >

            <video muted autoplay loop playsinline>
                <source
                    src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
                    type="video/mp4"
                >
            </video>

            <div class="video-title">
                Глаша отвечает
            </div>

        </div>

        <!-- 3 -->

        <div
            class="video-card"
            onclick="changeVideo('https://www.w3schools.com/html/movie.mp4')"
        >

            <video muted autoplay loop playsinline>
                <source
                    src="https://www.w3schools.com/html/movie.mp4"
                    type="video/mp4"
                >
            </video>

            <div class="video-title">
                Глаша уходит на покой
            </div>

        </div>

    </div>

</div>

<script>

/* СМЕНА ВИДЕО */

function changeVideo(videoUrl){

    const player = document.getElementById("mainPlayer");

    player.src = videoUrl;

    player.play();

}

/* СКРЫТЬ / ПОКАЗАТЬ ПАНЕЛЬ */

function toggleVideos(){

    const grid = document.getElementById("videoGrid");

    grid.classList.toggle("hide");

}

</script>

</body>
</html>
