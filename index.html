<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Глаша</title>

<style>
body{
margin:0;
background:black;
overflow:hidden;
font-family:serif;
}

video{
position:fixed;
width:100%;
height:100%;
object-fit:cover;
}

.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
display:flex;
align-items:flex-end;
justify-content:center;
padding-bottom:80px;
background:rgba(0,0,0,0.15);
}

#bell{
position:absolute;
right:18px;
bottom:12px;
width:22px;
cursor:pointer;
transition:0.2s;
filter:drop-shadow(0 0 8px rgba(255,220,120,0.6));
}
#bell:active{
transform:scale(0.92);
}
<video id="glashaVideo" autoplay muted loop playsinline style="width:100%; height:100%; object-fit:cover;">
  <source src="./idle.mp4" type="video/mp4">
</video>

<div class="overlay">
<img
src="./IMG_2559.png"
id="bell"
onclick="toggleGlasha()"
/>
</div>



<script>

let state = 0;

function toggleGlasha() {

const video = document.getElementById("glashaVideo");

const ring = new Audio("./Ring.mp3");
ring.currentTime = 0;
ring.play();

if(state === 0){

video.pause();

video.src = "./response.mp4";
video.loop = false;
video.muted = false;

video.load();
video.play();

state = 1;

}

else if(state === 1){

video.pause();

video.src = "./farewell.MP4";
video.loop = false;
video.muted = false;

video.load();
video.play();

state = 2;

video.onended = function(){

video.src = "./idle.mp4";
video.loop = true;
video.muted = true;

video.load();
video.play();

state = 0;

}
}

}

</script>
