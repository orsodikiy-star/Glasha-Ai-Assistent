<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Глаша</title>

<style>
body{
margin:0;
background:black;
overflow:hidden;
font-family:serif;
}

video{
position:fixed;
width:100%;
height:100%;
object-fit:cover;
}

.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
display:flex;
align-items:flex-end;
justify-content:center;
padding-bottom:80px;
background:rgba(0,0,0,0.15);
}

button{
background:rgba(255,255,255,0.1);
border:1px solid rgba(255,255,255,0.2);
color:white;
padding:18px 40px;
font-size:22px;
border-radius:20px;
backdrop-filter:blur(10px);
}

button:active{
transform:scale(0.97);
}
</style>
</head>

<body>

<video id="glashaVideo" autoplay muted loop playsinline style="width:100%; height:100%; object-fit:cover;">
  <source src="./idle.mp4" type="video/mp4">
</video>

<div class="overlay">
<button onclick="speak()">Позвать Глашу</button>
</div>



<script>
function speak() {
  const video = document.getElementById("glashaVideo");

  video.pause();
  video.src = "./response.mp4";
  video.loop = false;
  video.muted = false;
  video.load();
  video.play();
}
</script>
