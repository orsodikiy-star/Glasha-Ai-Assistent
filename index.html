<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Глаша</title>

<style>
body{
margin:0;
background:black;
overflow:hidden;
font-family:serif;
}

video{
position:fixed;
width:100%;
height:100%;
object-fit:cover;
}

.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
display:flex;
align-items:flex-end;
justify-content:center;
padding-bottom:80px;
background:rgba(0,0,0,0.15);
}

button{
background:rgba(255,255,255,0.1);
border:1px solid rgba(255,255,255,0.2);
color:white;
padding:18px 40px;
font-size:22px;
border-radius:20px;
backdrop-filter:blur(10px);
}

button:active{
transform:scale(0.97);
}
</style>
</head>

<body>

<video autoplay muted loop playsinline>
<source src="Digen_video_1779789215169.mp4" type="video/mp4">
</video>

<div class="overlay">
<button onclick="speak()">Позвать Глашу</button>
</div>

<audio id="glashaVoice" controls src="./Glasha.mp3" preload="auto"></audio>

<script>
function speak() {

    const audio = document.getElementById("glashaVoice");

    audio.currentTime = 0;

    audio.play();

}
</script>
