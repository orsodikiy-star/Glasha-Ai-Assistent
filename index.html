<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Glasha</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: black;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

#glashaVideo {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.bellButton {
  position: fixed;

  top: 15px;
  right: 20px;

  width: 80px;
  height: 80px;

  z-index: 999999;

  font-size: 40px;

  background: rgba(0,0,0,0.4);

  border: 2px solid white;

  border-radius: 50%;

  color: white;

  cursor: pointer;
}
}
}
}

}

.title {
  position: fixed;
  top: 25px;
  left: 25px;
  z-index: 10;
  color: white;
  font-size: 32px;
  font-weight: bold;
  text-shadow: 0 0 10px black;
}
</style>
</head>

<body>

<div class="title">Glasha</div>

  <button class="bellButton" onclick="ringBell()">🔔</button>

<video id="glashaVideo" loop playsinline>
  <source src="idle.mp4" type="video/mp4">
</video>

<audio id="bellSound">
  <source src="Ring.mp3" type="audio/mpeg">
</audio>

<script>
let step = 0;

const video = document.getElementById("glashaVideo");
const bellSound = document.getElementById("bellSound");

function ringBell() {
  bellSound.currentTime = 0;
  bellSound.play();
  setTimeout(() => {
  bellSound.pause();
  bellSound.currentTime = 0;
}, 800);

  step++;

  if (step === 1) {
    video.src = "response.mp4";
    video.loop = false;
    video.play();
    
  }

  else if (step === 2) {
    video.src = "farewell.MP4";
    video.loop = false;
    video.play();
  

  else {
    step = 0;
    video.src = "idle.mp4";
    video.loop = true;
    video.play();
  }
}

video.addEventListener("ended", function() {
  if (step === 1 || step === 2) {
    video.src = "idle.mp4";
    video.loop = true;
    video.play();
  }
});
</script>

</body>
</html>
